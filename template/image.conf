# Luckfox Lyra Zero W, from Luckfox_Lyra_Zero_W_Flash_261020.
#
# Verified against a real update.img: model, id, manufacturer, version, chip,
# and every item's partition size and flash sector.
#
# fw_version and merge_version below are the common Rockchip values, not read
# from that image. If you want output byte-identical to the vendor's, take
# them from `rkimage unpack` on your own update.img instead of trusting these.

model = RK3506
id = 007
manufacturer =  RK3506
version = 0x08010000
fw_version = 0x00000101
merge_version = 0x01000000
release = 2026-10-19 10:51:18
chip = 350F
loader = MiniLoaderAll.bin

# item <name> <path> <partition sectors> <flash sector>
# '-' means none, or a partition that grows to fill the device.
# Partition sizes and sectors match the mtdparts line in parameter.txt.
item package-file package-file 0 -
item parameter parameter.txt 0x2000 0x0
item bootloader MiniLoaderAll.bin 0 -
item uboot uboot.img 0x2000 0x2000
item boot boot.img 0x6000 0x4000
item rootfs rootfs.img - 0x10000
