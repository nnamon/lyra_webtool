name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an in-flight deploy, but never a running one midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Test protocol crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test -p rockusb --verbose
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p rockusb -- -D warnings

  build:
    name: Build wasm bundle
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli
        run: |
          # Must match the wasm-bindgen version pinned in app/Cargo.toml.
          VERSION=$(grep -oE 'wasm-bindgen = "=[0-9.]+"' app/Cargo.toml | grep -oE '[0-9.]+')
          echo "wasm-bindgen version: $VERSION"
          cargo install wasm-bindgen-cli --version "$VERSION" --locked

      - name: Build
        run: ./build.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
